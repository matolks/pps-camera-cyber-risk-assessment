# Nginx reverse proxy example for a PPS camera mitigation design.
#
# Replace these placeholders before use:
# - PROXY_PRIVATE_IP
# - CAMERA_PRIVATE_IP
#
# Example architecture:
# - NVR/client subnet sends HTTP requests to PROXY_PRIVATE_IP
# - Nginx inspects the request
# - Allowed requests are proxied to CAMERA_PRIVATE_IP
#
# This file is not a complete production hardening guide.

server {
    listen PROXY_PRIVATE_IP:80;
    server_name _;

    access_log /var/log/nginx/camera_access.log;
    error_log  /var/log/nginx/camera_error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    # Block unauthenticated access paths.
    # Generalized for public doc.
    location ~* ^/RESTRICTED_STREAM_PATH {
        return 403 "Blocked: restricted camera endpoint";
    }

    # Block unsafe management operations.
    # Ggeneralized for public doc.
    location ~* ^/(RESTRICTED_API|RESTRICTED_MANAGEMENT)/ {
        if ($request_method = PUT) {
            return 403 "Blocked: unsafe management method";
        }
        if ($args ~* "(^|&)auth=") {
            return 403 "Blocked: suspicious authentication bypass pattern";
        }
        proxy_pass http://CAMERA_PRIVATE_IP;
    }

    # Allow normal camera/NVR traffic.
    location / {
        proxy_pass http://CAMERA_PRIVATE_IP;
    }
}