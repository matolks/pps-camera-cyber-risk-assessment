# Nginx reverse proxy configuration for the protected camera
# Replace the placeholder IPs before enabling this site

server {
    listen PROXY_PRIVATE_IP:80;
    server_name _;

    access_log /var/log/nginx/camera_access.log;
    error_log  /var/log/nginx/camera_error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    # Block camera endpoints
    location ~* ^/RESTRICTED_STREAM_PATH {
        return 403 "Blocked";
    }

    # Block management requests
    location ~* ^/(RESTRICTED_API|RESTRICTED_MANAGEMENT)/ {
        if ($request_method = PUT) {
            return 403 "Blocked";
        }
        if ($args ~* "(^|&)auth=") {
            return 403 "Blocked";
        }
        proxy_pass http://CAMERA_PRIVATE_IP;
    }

    # Forward normal traffic
    location / {
        proxy_pass http://CAMERA_PRIVATE_IP;
    }
}